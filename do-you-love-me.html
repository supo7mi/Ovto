<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Do you love me?</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Audiowide&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    overflow-x: hidden;
    background: #07001a;
  }

  /* Fondo galaxia morada */
  body {
    background:
      radial-gradient(ellipse at 20% 30%, rgba(140, 50, 220, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(80, 20, 180, 0.55) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(180, 100, 255, 0.18) 0%, transparent 70%),
      linear-gradient(135deg, #0a0020 0%, #1a0033 40%, #2a0050 70%, #0d0024 100%);
    background-attachment: fixed;
    position: relative;
  }

  /* Capa de estrellas */
  .stars, .stars2, .stars3 {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .stars {
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 50px 160px, #ddd, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(1px 1px at 160px 120px, #ddd, transparent);
    background-repeat: repeat;
    background-size: 200px 200px;
    animation: twinkle 4s linear infinite;
  }
  .stars2 {
    background-image:
      radial-gradient(1.5px 1.5px at 25px 50px, #e0b3ff, transparent),
      radial-gradient(1.5px 1.5px at 100px 100px, #fff, transparent),
      radial-gradient(2px 2px at 170px 30px, #c77dff, transparent),
      radial-gradient(1px 1px at 200px 180px, #fff, transparent);
    background-repeat: repeat;
    background-size: 300px 300px;
    animation: twinkle 6s linear infinite reverse;
    opacity: 0.7;
  }
  .stars3 {
    background-image:
      radial-gradient(2.5px 2.5px at 80px 80px, #d896ff, transparent),
      radial-gradient(2px 2px at 220px 220px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 300px 50px, #b066ff, transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    animation: twinkle 8s linear infinite;
    opacity: 0.5;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 0.3; }
  }

  /* Nebulosa flotante */
  .nebula {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180, 80, 255, 0.25) 0%, transparent 70%);
    filter: blur(60px);
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  .nebula.one { top: -100px; left: -100px; }
  .nebula.two {
    bottom: -100px; right: -100px;
    background: radial-gradient(circle, rgba(255, 100, 220, 0.2) 0%, transparent 70%);
    animation-delay: -6s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, 30px) scale(1.1); }
  }

  /* Contenedor principal */
  .container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  /* Pregunta */
  .question-bubble {
    background: linear-gradient(135deg, rgba(80, 20, 140, 0.6), rgba(140, 50, 220, 0.4));
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 2px solid rgba(200, 130, 255, 0.6);
    border-radius: 50px;
    padding: 40px 60px;
    margin-bottom: 60px;
    box-shadow:
      0 0 40px rgba(180, 80, 255, 0.5),
      0 0 80px rgba(140, 50, 220, 0.3),
      inset 0 0 30px rgba(200, 130, 255, 0.15);
    animation: pulseGlow 3s ease-in-out infinite;
    max-width: 90%;
  }
  @keyframes pulseGlow {
    0%, 100% {
      box-shadow:
        0 0 40px rgba(180, 80, 255, 0.5),
        0 0 80px rgba(140, 50, 220, 0.3),
        inset 0 0 30px rgba(200, 130, 255, 0.15);
    }
    50% {
      box-shadow:
        0 0 60px rgba(200, 100, 255, 0.7),
        0 0 120px rgba(180, 80, 255, 0.5),
        inset 0 0 40px rgba(220, 150, 255, 0.25);
    }
  }
  .question-bubble h1 {
    font-family: 'Audiowide', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    background: linear-gradient(90deg, #ff66ff, #c77dff, #e0b3ff, #ff66ff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    text-shadow: 0 0 30px rgba(200, 100, 255, 0.5);
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }

  /* Opciones */
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    justify-content: center;
    align-items: center;
  }

  .option-btn {
    position: relative;
    background: linear-gradient(135deg, rgba(60, 10, 120, 0.7), rgba(120, 40, 200, 0.5));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(200, 130, 255, 0.7);
    border-radius: 60px;
    padding: 30px 50px;
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    min-width: 250px;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow:
      0 0 30px rgba(180, 80, 255, 0.4),
      inset 0 0 20px rgba(200, 130, 255, 0.2);
    text-shadow: 0 0 10px rgba(255, 200, 255, 0.8);
  }

  .option-btn::before {
    content: '';
    position: absolute;
    top: -3px; left: -3px; right: -3px; bottom: -3px;
    background: linear-gradient(45deg, #ff66ff, #c77dff, #6a00ff, #ff66ff);
    background-size: 300% 300%;
    border-radius: 60px;
    z-index: -1;
    opacity: 0;
    transition: opacity 0.4s ease;
    animation: gradientMove 3s linear infinite;
    filter: blur(8px);
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .option-btn:hover {
    transform: translateY(-8px) scale(1.05);
    box-shadow:
      0 10px 50px rgba(220, 100, 255, 0.7),
      0 0 80px rgba(180, 80, 255, 0.5),
      inset 0 0 30px rgba(220, 150, 255, 0.4);
    border-color: rgba(255, 180, 255, 1);
  }

  .option-btn:hover::before {
    opacity: 1;
  }

  .option-btn:active {
    transform: translateY(-3px) scale(1.02);
  }

  /* Opción 1 - tinte rosa/violeta */
  .option-1 {
    background: linear-gradient(135deg, rgba(120, 20, 100, 0.7), rgba(180, 50, 150, 0.5));
  }

  /* Opción 2 - tinte azul/violeta */
  .option-2 {
    background: linear-gradient(135deg, rgba(40, 20, 140, 0.7), rgba(100, 50, 220, 0.5));
  }

  /* Partículas flotantes decorativas */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .question-bubble { padding: 30px 30px; margin-bottom: 40px; }
    .options { flex-direction: column; gap: 25px; }
    .option-btn { padding: 25px 40px; min-width: 220px; }
  }

  /* Decoración orbital */
  .orbit-decoration {
    position: absolute;
    top: 50%; left: 50%;
    width: 800px; height: 800px;
    border: 1px solid rgba(200, 130, 255, 0.1);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    animation: rotate 60s linear infinite;
  }
  .orbit-decoration::before {
    content: '';
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    background: #e0b3ff;
    border-radius: 50%;
    box-shadow: 0 0 20px #e0b3ff;
  }
  @keyframes rotate {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
</style>
</head>
<body>
  <!-- Fondos -->
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="nebula one"></div>
  <div class="nebula two"></div>
  <div class="orbit-decoration"></div>

  <!-- Contenido -->
  <div class="container">
    <div class="question-bubble">
      <h1>Do you love me?</h1>
    </div>

    <div class="options">
      <a class="option-btn option-1"
         href="https://open.spotify.com/track/57WroSoheS9bWCtALlXA1t?si=zt7lBGaZR1aWOCGsJ4Twmw">
        No, come kk
      </a>
      <a class="option-btn option-2"
         href="https://open.spotify.com/track/1HM9uVbB4DVQh0QlwY7W6v?si=nu_gSZNISIKXOwNRrczieg">
        Sí, no comas kk
      </a>
    </div>
  </div>

  <script>
    // Crear partículas flotantes
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 3 + 1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      const colors = ['#ff66ff', '#c77dff', '#e0b3ff', '#b066ff', '#ffffff'];
      const c = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = c;
      p.style.boxShadow = `0 0 ${size * 4}px ${c}`;
      p.style.animation = `float ${Math.random() * 10 + 8}s ease-in-out infinite`;
      p.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(p);
    }
  </script>

</body>
</html>
